site_name: skill-manager
site_description: Skill lifecycle management for LangChain and LangGraph applications
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
nav:
  - Home: index.md
  - Start:
      - Install and first bundle: getting-started.md
      - Agent Skills: agent-skills.md
      - Skills and protocol:
          - Skill model: concepts/skills.md
          - YAML protocol: concepts/skill-protocol.md
          - Identity and revisions: concepts/skill-id.md
          - Bundle composition: concepts/skill-bundles.md
  - Core workflows:
      - Store Skills:
          - Filesystem source: guides/filesystem-source.md
          - Database source: guides/database-source.md
          - Sources: concepts/skill-sources.md
          - Registry: concepts/registry.md
      - Discover Skills:
          - Discovery: concepts/discovery.md
          - Semantic discovery: guides/semantic-discovery.md
          - Semantic discovery concepts: concepts/semantic-discovery.md
      - Resolve requirements:
          - Dependencies: concepts/dependencies.md
          - Capabilities: concepts/capabilities.md
          - MCP capabilities: guides/mcp-capabilities.md
      - Govern revisions:
          - Governance: concepts/governance.md
          - Generate a Skill: guides/agent-skill-generation.md
          - Approve: guides/approval-workflow.md
          - Reject and revise: guides/rejection-feedback.md
          - Approval concepts: concepts/approval.md
          - Rejection concepts: concepts/rejection.md
          - Feedback: concepts/feedback-loop.md
          - Provenance: concepts/provenance.md
  - Integrations:
      - LangGraph: guides/langgraph.md
      - LangChain create_agent: examples/langchain-create-agent.md
      - Deep Agents: examples/deepagents.md
      - Local model and ContextSage: examples/local-llm-contextsage.md
      - Ollama embeddings: examples/ollama-embeddings.md
      - PostgreSQL source and registry: examples/postgres-source.md
      - Local MCP and LangGraph: examples/full-end-to-end.md
  - Operations:
      - Catalog lifecycle views: examples/catalog-views.md
      - Review console: examples/streamlit-skill-lifecycle.md
      - Refresh: guides/refresh.md
      - Refresh concepts: concepts/refresh.md
      - Observability: concepts/observability.md
      - Performance: guides/performance.md
      - Live telemetry example: examples/live-all-parameters-grafana.md
  - Extend:
      - Custom source: guides/custom-source.md
      - Custom discovery: guides/custom-discovery.md
      - Custom validator: guides/custom-validator.md
      - Retrieval and reranking: examples/custom-retrieval-reranking.md
      - Constructor injection: examples/constructor-injection-matrix.md
  - Architecture:
      - Overview: architecture/overview.md
      - Lifecycle: architecture/lifecycle.md
      - Governance: architecture/governance.md
      - Feedback boundary: architecture/feedback-boundary.md
      - Responsibility matrix: architecture/RESPONSIBILITY_MATRIX.md
      - Dependency boundaries: architecture/dependency-boundaries.md
      - Dependency matrix: architecture/DEPENDENCY_MATRIX.md
      - Public API map: architecture/PUBLIC_API_MAP.md
      - Decisions: architecture/ARCHITECTURE_DECISIONS.md
      - Documentation map: architecture/DIRECTORY_STRUCTURE.md
  - Runnable examples:
      - Basic bundle: examples/basic.md
      - Filesystem: examples/filesystem-source.md
      - Multiple sources: examples/multiple-sources.md
      - Dynamic discovery: examples/dynamic-discovery.md
      - Semantic discovery: examples/semantic-discovery.md
      - Dependencies: examples/transitive-dependencies.md
      - Shared capability: examples/shared-capability.md
      - MCP: examples/mcp.md
      - Agent-generated Skill: examples/agent-generated-skill.md
      - Approval: examples/approval.md
      - Rejection: examples/rejection-feedback.md
      - Feedback-informed regeneration: examples/feedback-informed-regeneration.md
      - Refresh: examples/refresh.md
      - LangGraph: examples/langgraph.md
  - API reference: reference/api.md
