[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "skill-manager"
version = "0.1.0"
description = "Async-first Skill lifecycle management for LangChain and LangGraph applications"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
authors = [{ name = "S MUNI HARISH" }]
keywords = ["skills", "langchain", "langgraph", "agents", "yaml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "contextsage>=0.1.0,<0.2",
  "feedback-manager>=0.1.0,<0.2",
  "langchain>=1.4.2,<2",
  "langgraph>=1.2.12,<1.3",
  "langgraph-xai>=0.1.0,<0.2",
  "mcp-capability-router>=0.1.0,<0.2",
  "packaging>=24.0",
  "pydantic>=2.12,<3",
  "PyYAML>=6.0.2,<7",
  "refresh-engine>=0.1.0,<0.2",
  "xstructured>=0.1.0,<0.2",
]

[project.optional-dependencies]
deepagents = ["deepagents>=0.7.19,<0.8"]
mcp = ["langchain-mcp-adapters>=0.1.0"]
openai-compatible = ["langchain-openai>=0.3,<2"]
observability = [
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
]
ollama-embeddings = ["langchain-ollama>=0.3,<2"]
postgres = [
    "asyncpg>=0.30,<1",
]
ui = ["streamlit>=1.45,<2"]

[dependency-groups]
dev = [
  "black>=25.1",
  "build>=1.2",
  "coverage[toml]>=7.6",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "numpy>=2.0",
  "pyrefly>=0.18",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "twine>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skill_manager"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/benchmarks",
  "/README.md",
  "/LICENSE",
  "/mkdocs.yml",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["skill_manager"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv312", ".venv-smoke", "site", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.12"
